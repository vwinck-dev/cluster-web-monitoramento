server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/cluster_access.log cluster_metrics;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /health {
        access_log off;
        return 200 'ok\n';
    }
}
